[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laugh-loop"
version = "0.1.0-rc.1"
description = "A tiny Temporal app that fetches jokes from free public APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "temporalio>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laugh_loop"]

[dependency-groups]
dev = [
    "python-semantic-release>=10.7.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
# Invalid API payloads are all reported as ValueError so callers handle one error type.
ignore = ["TRY004"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = true
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
# uv.lock records the project version, so refresh it and include it in the release commit.
build_command = """
uv lock --upgrade-package laugh-loop
git add uv.lock
uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false


[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
