[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laugh-loop"
version = "0.1.0"
description = "A tiny Temporal app that fetches jokes from free public APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "temporalio>=1.10,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/laugh_loop"]
