version: v1.0
name: Laugh Loop CI/CD
agent:
  machine:
    type: f1-standard-2 #e1-standard-2
    os_image: ubuntu2204
  containers:
    - name: main
      image: ghcr.io/astral-sh/uv:python3.12-bookworm

blocks:
  - name: Lint
    dependencies: []
    task:
      jobs:
        - name: Ruff
          commands:
            - checkout
            - uv sync --locked
            - uv run --locked ruff check .
            - uv run --locked ruff format --check .

  - name: Unit tests
    dependencies: []
    task:
      jobs:
        - name: Run unit tests
          commands:
            - checkout
            - uv sync --locked
            - uv run --locked python -m unittest discover -s tests -v

  - name: Docker images
    dependencies:
      - Lint
      - Unit tests
    run:
      when: "branch = 'main'"
    task:
      # Docker is not available inside the uv container, so build on the VM itself.
      agent:
        machine:
          type: f1-standard-2
          os_image: ubuntu2204
      env_vars:
        - name: IMAGE_PREFIX
          value: ghcr.io/alexc75/laugh-loop
      secrets:
        - name: ghcr
      prologue:
        commands:
          - checkout
          # uv runs semantic-release to compute the image tag.
          - curl -LsSf https://astral.sh/uv/0.13.3/install.sh | sh
          - export PATH="$HOME/.local/bin:$PATH"
      jobs:
        - name: Build worker and starter
          matrix:
            - env_var: TARGET
              values: ["worker", "starter"]
          commands:
            - .semaphore/docker-image.sh "$TARGET"

  - name: Release
    dependencies:
      - Lint
      - Unit tests
    run:
      when: "branch = 'main'"
    task:
      secrets:
        - name: github-release
      jobs:
        - name: Bump version and publish GitHub Release
          commands:
            - checkout
            # semantic-release needs the full history and tags to compute the next version.
            # Semaphore clones only the last 50 commits; --unshallow fails on a full clone.
            - git fetch --unshallow --tags || git fetch --tags
            - git config user.name "semaphore-ci"
            - git config user.email "semaphore-ci@users.noreply.github.com"
            - uv sync --locked
            - NEXT=$(uv run --locked semantic-release version --print)
            - LAST=$(uv run --locked semantic-release version --print-last-released)
            - >-
              if [ "$NEXT" = "$LAST" ]; then echo "No fix/feat commits since v$LAST, skipping release";
              else uv run --locked semantic-release version && uv run --locked semantic-release publish; fi
