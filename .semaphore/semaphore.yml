version: v1.0
name: Laugh Loop CI/CD
agent:
  machine:
    type: a2-standard-4 #e1-standard-2
    os_image: ubuntu2204
  containers:
    - name: main
      image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

blocks:
  - name: Unit tests
    dependencies: []
    task:
      prologue:
        commands:
          - apt-get update
          - apt-get install -y git
      jobs:
        - name: Run unit tests
          commands:
            - checkout
            - uv sync --locked
            - uv run --locked python -m unittest discover -s tests -v

  - name: Publish GitHub Release
    dependencies:
      - Unit tests
    run:
      when: "branch = 'main'"
    task:
      secrets:
        - name: github-release
      prologue:
        commands:
          - apt-get update
          - apt-get install -y git gh
      jobs:
        - name: Build and publish distributions
          commands:
            - checkout
            - uv build
            - >-
              gh release create "main-$(git rev-parse --short=12 HEAD)" dist/*
              --title "Laugh Loop main-$(git rev-parse --short=12 HEAD)"
              --notes "Automated release for commit $(git rev-parse HEAD)."
